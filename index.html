<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>北陸・信州・東京　九日</title>
<meta name="theme-color" content="#1c1a19"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 2025 北陸回憶錄（書本版）：每一站一頁、每個地區一章；電腦攤開兩頁、手機一頁；翻頁是 3D 翻頁。
   章的配色：1 大阪夜（藍黑＋霓虹橘）／2 金澤・白川鄉（雪白＋冰藍＋金箔）／3 妙高（雪＋松綠＋滑雪紅）／4 信州溫泉（木頭米＋燈籠紅）／5 東京（夜黑＋洋紅＋青）／6 歸途（清晨粉灰） */
:root{
  --desk:#1c1a19; --desk2:#2a2724;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --hand:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","DFKai-SB",serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --W:460px; --H:626px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 40%,#3a3530 0%,var(--desk) 70%);color:#eee;font:15px/1.7 var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;perspective:2200px;padding:calc(env(safe-area-inset-top,0px) + 16px) 0 calc(env(safe-area-inset-bottom,0px) + 22px)}
#book{position:relative;width:calc(var(--W)*2);height:var(--H);transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
#stage.tilt #book{transform:translateY(6%) rotateX(34deg)}
#base{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;top:0;width:var(--W);height:var(--H);overflow:hidden}
.spread{position:absolute;top:0;left:0;width:calc(var(--W)*2);height:var(--H);transform-style:preserve-3d}
.pg{position:absolute;top:0;width:var(--W);height:var(--H);overflow:hidden;background:var(--paper);color:var(--ink);padding:50px 44px 50px}
.pg.L{left:0;border-radius:6px 0 0 6px;box-shadow:inset -26px 0 30px -22px rgba(0,0,0,.35)}
.pg.R{left:var(--W);border-radius:0 6px 6px 0;box-shadow:inset 26px 0 30px -22px rgba(0,0,0,.35)}
.pg.none{background:none;box-shadow:none}
.spread:not(.m) .pg.L:not(.none)::after,.spread:not(.m) .pg.R:not(.none)::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.07),transparent 8%,transparent 92%,rgba(0,0,0,.05))}
.full{position:absolute;inset:0;background:var(--paper);color:var(--ink);border-radius:6px;transform-style:preserve-3d}
.full::before{content:"";position:absolute;top:0;bottom:0;left:calc(50% - 30px);width:60px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.18) 50%,transparent);pointer-events:none}
#book::after{content:"";position:absolute;left:var(--bl,4px);right:var(--br,4px);bottom:-14px;height:14px;background:linear-gradient(#cfc5b4,#9b9180);border-radius:0 0 6px 6px;transform:translateZ(-1px);box-shadow:0 14px 30px rgba(0,0,0,.5)}
.leaf{position:absolute;top:0;width:var(--W);height:var(--H);transform-style:preserve-3d;z-index:5;transition:transform .75s cubic-bezier(.45,.05,.3,1)}
.leaf .face{left:0;backface-visibility:hidden}
.leaf .face.back{transform:rotateY(180deg)}
.leaf .face::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.0),rgba(0,0,0,.18));opacity:0;transition:opacity .75s;pointer-events:none}
.leaf.go .face::after{opacity:1}

/* ---------- 章的配色 ---------- */
.ch0{--paper:#f3ede2;--ink:#2a2622;--acc:#a8432f;--sub:#7d7466;--ph1:#c9bfae;--ph2:#9a8f7e}
.ch1{--paper:#22202e;--ink:#efe5d3;--acc:#ff8a3d;--sub:#9b93b3;--ph1:#3b3552;--ph2:#5d3b4a}
.ch2{--paper:#f5f7f9;--ink:#24313c;--acc:#b8902f;--sub:#7f95a8;--ph1:#cfdbe6;--ph2:#8fa6ba}
.ch3{--paper:#eef2ee;--ink:#1f2b24;--acc:#c8322b;--sub:#2f5d46;--ph1:#cfdcd2;--ph2:#5f8170}
.ch4{--paper:#f1e5d2;--ink:#3a2a1f;--acc:#b5452b;--sub:#8a6a4a;--ph1:#dcc6a6;--ph2:#a07c58}
.ch5{--paper:#121218;--ink:#ecebf3;--acc:#ff3d8b;--sub:#36d6f0;--ph1:#24233a;--ph2:#3b1f3a}
.ch6{--paper:#f4eae7;--ink:#3b3340;--acc:#d97a68;--sub:#8b7f93;--ph1:#e8d4d0;--ph2:#b8a3b0}
.cover{--paper:#1f2c3a;--ink:#f2ead8;--acc:#d9b25c}

/* ---------- 共用頁面元素 ---------- */
.rh{position:absolute;top:16px;left:40px;right:40px;display:flex;justify-content:space-between;font:11px var(--mono);letter-spacing:.12em;color:var(--sub);text-transform:uppercase}
.pn{position:absolute;bottom:16px;font:12px var(--mono);color:var(--sub)}
.L .pn{left:40px}.R .pn{right:40px}
.meta{font:12px var(--mono);letter-spacing:.08em;color:var(--sub)}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.3;text-wrap:balance}
h2{font-size:28px;font-weight:900}
h3{font-size:18px;font-weight:700}
p{margin:0}
.txt{font-size:14.5px;line-height:1.85}
.one{font-family:var(--serif);font-size:16px;line-height:1.7;color:var(--acc);border-top:1px solid color-mix(in srgb,var(--ink) 18%,transparent);padding-top:10px}
.col{display:flex;flex-direction:column;gap:14px;height:100%}
.ph{position:relative;border-radius:3px;background:linear-gradient(135deg,var(--ph1),var(--ph2));overflow:hidden;min-height:0}
.ph::after{content:attr(data-l);position:absolute;left:8px;bottom:6px;font:11px var(--mono);color:color-mix(in srgb,var(--ink) 75%,transparent);letter-spacing:.05em}
.ph.v{aspect-ratio:3/4}.ph.h{aspect-ratio:4/3}.ph.w{aspect-ratio:16/9}
.ph.vid::before{content:"▶";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:var(--acc);color:var(--paper);display:flex;align-items:center;justify-content:center;font-size:18px;padding-left:4px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
button{font:inherit;color:inherit}

/* ---------- 封面、封底 ---------- */
.cv{background:linear-gradient(160deg,#243546,#16212d);color:var(--ink);padding:56px 44px;display:flex;flex-direction:column;justify-content:space-between}
.cv .ttl{font-family:var(--serif);font-weight:900;font-size:40px;line-height:1.25;letter-spacing:.04em}
.cv .sub{font-family:var(--serif);font-size:16px;color:var(--acc);margin-top:14px}
.cv .route{font:12px var(--mono);letter-spacing:.14em;color:#9fb0c2;line-height:2}
.cv .win{position:relative;height:42%;border:1px solid rgba(217,178,92,.6);border-radius:120px 120px 4px 4px;overflow:hidden;background:linear-gradient(#5d7a96,#c9d7e3 70%,#eef3f7)}
.cv .win::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,#fff 1.2px,transparent 1.6px),radial-gradient(circle,#fff .8px,transparent 1.2px);background-size:26px 26px,17px 17px;animation:snow 9s linear infinite;opacity:.9}
@keyframes snow{to{background-position:0 260px,12px 170px}}
.cv .mtn{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(transparent,transparent),#f4f7fa;clip-path:polygon(0 60%,18% 30%,30% 52%,48% 8%,64% 46%,78% 26%,100% 58%,100% 100%,0 100%)}
.bk{background:linear-gradient(200deg,#243546,#16212d);color:#c9d3dc;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:56px 44px}

/* ---------- 目錄 ---------- */
.toc li{display:grid;grid-template-columns:44px 1fr auto;align-items:baseline;gap:8px;padding:10px 0;border-bottom:1px dashed color-mix(in srgb,var(--ink) 22%,transparent);cursor:pointer}
.toc{list-style:none;margin:18px 0 0;padding:0}
.toc .no{font:12px var(--mono);color:var(--acc)}
.toc b{font-family:var(--serif);font-size:17px}
.toc small{display:block;font-size:12px;color:var(--sub)}
.toc .p{font:12px var(--mono);color:var(--sub)}
.toc li:hover b{color:var(--acc)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* ---------- 章扉頁 ---------- */
.op{display:flex;flex-direction:column;height:100%;gap:16px}
.op .k{font:12px var(--mono);letter-spacing:.3em;color:var(--acc)}
.op h2{font-size:34px}
.op .ph{flex:1}
.op .q{font-family:var(--serif);font-size:15px;line-height:1.8;border-left:3px solid var(--acc);padding-left:12px}
.snow::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.95) 1.4px,transparent 1.8px),radial-gradient(circle,rgba(255,255,255,.8) .9px,transparent 1.3px);background-size:34px 34px,21px 21px;animation:snow 12s linear infinite;z-index:3;mix-blend-mode:screen}
.ch2 .snow::before,.ch3 .snow::before{background-image:radial-gradient(circle,rgba(150,175,198,.55) 1.4px,transparent 1.8px),radial-gradient(circle,rgba(150,175,198,.45) .9px,transparent 1.3px);mix-blend-mode:normal}

/* ---------- 相簿頁（一站很多張） ---------- */
.alb{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:5px;flex:1;min-height:0}
.alb .ph{cursor:zoom-in;aspect-ratio:auto}
.alb .ph:nth-child(1){grid-column:span 2;grid-row:span 2}
.alb .ph:nth-child(7){grid-row:span 2}
.alb .ph::after{font-size:9px}
.more{align-self:flex-start;border:1px solid var(--ink);background:none;padding:6px 12px;font:12px var(--mono);cursor:pointer;letter-spacing:.06em}

/* ---------- 立體書頁 ---------- */
.popw{position:absolute;inset:0;transform-style:preserve-3d}
.pl{position:absolute;transform-origin:50% 100%;transform:rotateX(0deg);transition:transform 1.1s cubic-bezier(.3,1.35,.4,1);transform-style:preserve-3d}
.open .pl{transform:rotateX(var(--a))}
.pl.m1{left:6%;right:52%;bottom:40%;height:34%;background:#dfe8f0;clip-path:polygon(0 100%,0 62%,22% 22%,40% 48%,58% 6%,80% 42%,100% 30%,100% 100%);--a:-62deg;transition-delay:.1s}
.pl.m2{left:44%;right:4%;bottom:40%;height:38%;background:#c7d5e2;clip-path:polygon(0 100%,0 48%,24% 14%,46% 40%,70% 0,100% 44%,100% 100%);--a:-60deg;transition-delay:.15s}
.pl.house{bottom:24%;width:16%;height:22%;background:#6d5640;--a:-56deg;transition-delay:.35s;clip-path:polygon(50% 0,100% 62%,100% 100%,0 100%,0 62%)}
.pl.house::after{content:"";position:absolute;left:0;right:0;top:0;height:64%;background:#f6f8fa;clip-path:polygon(50% 0,100% 98%,90% 100%,50% 18%,10% 100%,0 98%)}
.pl.h1{left:8%}.pl.h2{left:24%;height:18%;transition-delay:.42s}.pl.h3{right:8%;left:auto;transition-delay:.5s}.pl.h4{right:24%;left:auto;height:17%;transition-delay:.56s}
.pl.scr{left:33%;right:33%;bottom:16%;height:58%;--a:-58deg;transition-delay:.6s;background:#fff;padding:10px 10px 28px;box-shadow:0 18px 30px rgba(0,0,0,.25);border-radius:4px}
.pl.scr .ph{width:100%;height:100%;cursor:pointer}
.pl.scr .cap{position:absolute;left:12px;right:12px;bottom:5px;font:11px var(--mono);color:#556}
.pl.tree{bottom:22%;width:7%;height:20%;background:#4c6b5c;clip-path:polygon(50% 0,100% 100%,0 100%);--a:-50deg;transition-delay:.45s}
.pl.t1{left:42%}.pl.t2{right:43%}
.flat{position:absolute;left:44px;top:34px;width:28%;display:flex;flex-direction:column;gap:8px}
.flat.r{left:auto;right:44px;top:auto;bottom:34px;text-align:right;align-items:flex-end}
.popt{position:absolute;left:0;right:0;bottom:6%;text-align:center;font:12px var(--mono);color:var(--sub);letter-spacing:.1em}

/* ---------- 卡帶頁 ---------- */
.cass{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:center;padding:40px 34px}
.shelf{display:grid;grid-template-columns:1fr;gap:12px;align-content:center;justify-items:center}
.tape{position:relative;width:min(100%,170px);aspect-ratio:1.58;border:0;border-radius:6px;background:var(--tc,#2b2b35);cursor:pointer;padding:0;box-shadow:0 4px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.35);transition:transform .25s,opacity .3s}
.tape:hover{transform:translateY(-3px) rotate(-1deg)}
.tape .lb{position:absolute;left:8%;right:8%;top:9%;height:38%;background:#f3efe6;border-radius:2px;color:#222;font:11px/1.3 var(--sans);padding:4px 6px;text-align:left}
.tape .lb b{display:block;font:500 12px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tape .lb i{font:10px var(--mono);font-style:normal;color:#777}
.tape .win2{position:absolute;left:24%;right:24%;bottom:16%;height:26%;background:#1a1a1f;border-radius:14px;display:flex;justify-content:space-around;align-items:center}
.tape .win2 span{width:16px;height:16px;border-radius:50%;border:3px dotted #ddd}
.tape.out{opacity:.25;pointer-events:none;transform:translateY(-6px)}
.deck{position:relative;background:linear-gradient(#3a3a44,#24242c);border-radius:14px;padding:14px;box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);display:flex;flex-direction:column;gap:12px;transform:translateZ(30px)}
.deck .scrn{position:relative;aspect-ratio:16/10;background:#0b0c10;border-radius:6px;overflow:hidden;border:2px solid #111}
.deck .scrn .idle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:12px var(--mono);color:#58607a;letter-spacing:.12em;text-align:center;padding:10px}
.deck .slot{height:70px;border-radius:8px;background:#141419;display:flex;align-items:center;justify-content:center;gap:40px;position:relative}
.deck .slot .rl{width:34px;height:34px;border-radius:50%;border:4px dotted #6d6f80}
.deck.on .slot .rl{animation:spin 1.6s linear infinite;border-color:#d8dbe8}
@keyframes spin{to{transform:rotate(360deg)}}
.deck .ctl{display:flex;justify-content:space-between;align-items:center;font:11px var(--mono);color:#9aa0b6}
.deck .ctl button{background:#2f3038;border:1px solid #4a4b57;color:#d8dbe8;border-radius:4px;padding:5px 10px;cursor:pointer;font:11px var(--mono)}
.deck .led{width:8px;height:8px;border-radius:50%;background:#3a2a2a;display:inline-block;margin-right:6px}
.deck.on .led{background:#ff3d8b;box-shadow:0 0 8px #ff3d8b}
.scrn .play{position:absolute;inset:0}
.scrn .bar{position:absolute;left:10px;right:10px;bottom:8px;height:3px;background:rgba(255,255,255,.2)}
.scrn .bar i{display:block;height:100%;width:0;background:#ff3d8b;animation:prog 12s linear forwards}
@keyframes prog{to{width:100%}}
.scrn .gal{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
.scrn .gal .ph{aspect-ratio:auto;cursor:zoom-in}
.scrn .gal .ph::after{font-size:8px}
.ctitle{grid-column:1/-1;text-align:center;margin-bottom:6px}

/* ---------- 燈箱 ---------- */
#lb{position:fixed;inset:0;z-index:50;background:rgba(10,10,12,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
#lb[hidden]{display:none}
#lb .big{width:min(86vw,900px);max-height:76vh;aspect-ratio:4/3}
#lb .row{display:flex;gap:14px;align-items:center;font:13px var(--mono);color:#ccc}
#lb button{background:#2c2c33;border:1px solid #555;color:#eee;border-radius:4px;padding:8px 14px;cursor:pointer}

/* ---------- 底部操作列 ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;pointer-events:none;display:flex;justify-content:center;align-items:center;gap:10px;padding:6px 16px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
#nav button{pointer-events:auto;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#eee;border-radius:999px;padding:8px 16px;cursor:pointer;font:13px var(--sans)}
#nav button:disabled{opacity:.3;cursor:default}
#nav .info{font:12px var(--mono);color:#bbb;min-width:170px;text-align:center}
#hint{display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);font:11px var(--mono);color:#8d857a;letter-spacing:.1em;z-index:20}

/* ---------- 手機：一次一頁 ---------- */
.m .cv .ttl{font-size:32px}
.m .pg{left:0;border-radius:4px;padding:36px 22px 40px;box-shadow:inset 18px 0 22px -18px rgba(0,0,0,.35)}
.m .rh{left:22px;right:22px;top:12px}.m .pn{bottom:12px;left:auto;right:22px}
.m .full{border-radius:4px}.m .full::before{display:none}
.spread.m{width:var(--W)}
.m .cass{grid-template-columns:1fr;grid-template-rows:auto;padding:84px 14px 20px;gap:12px;align-content:start;align-items:start}
.m .cass .deck{grid-row:1;padding:10px;gap:8px}
.m .cass .deck .slot{height:46px}
.m .cass .shelf{grid-template-columns:repeat(3,1fr);gap:8px}
.m .tape{width:100%}
.m .tape .lb{font-size:9px;padding:3px 4px}.m .tape .lb b{font-size:10px}.m .tape .lb i{font-size:8px}
.m .tape .win2 span{width:10px;height:10px;border-width:2px}
@media (max-width:720px){#nav{gap:6px;padding-left:10px;padding-right:10px}#nav button{padding:7px 12px;white-space:nowrap}#nav .info{min-width:0;flex:1}#hint{display:none}}
.m .flat{left:20px;right:20px;width:auto;top:28px}
.m .flat.r{display:none}
.m .pl.scr{left:22%;right:22%;bottom:18%;height:52%}
.m .pl.m1{left:0;right:40%}.m .pl.m2{left:30%;right:0}

/* ===== 第二版：車票頁、章節索引標籤、三套配色 ===== */
.tab{position:absolute;width:7px;height:7%;top:calc(10% + var(--ti,0)*9%);background:var(--acc);z-index:4}
.L .tab{left:0;border-radius:0 3px 3px 0}.R .tab{right:0;border-radius:3px 0 0 3px}
.m .tab{right:0;left:auto;border-radius:3px 0 0 3px}
.ch1{--ti:0}.ch2{--ti:1}.ch3{--ti:2}.ch4{--ti:3}.ch5{--ti:4}.ch6{--ti:5}
.tkw{display:flex;flex-direction:column;height:100%;justify-content:center;gap:14px}
.tkw .meta{text-align:center}
.tk{position:relative;color:#2b2a28;padding:16px 22px 14px;border-radius:6px;transition:transform .6s cubic-bezier(.3,1.4,.4,1);
  background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--acc) 13%,#f7f3e9) 0 5px,#f7f3e9 5px 11px);
  box-shadow:0 10px 24px rgba(0,0,0,.22);
  -webkit-mask:radial-gradient(circle at 0 50%,transparent 11px,#000 11.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 11px,#000 11.5px) right/51% 100% no-repeat;
          mask:radial-gradient(circle at 0 50%,transparent 11px,#000 11.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 11px,#000 11.5px) right/51% 100% no-repeat}
.tk::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:var(--acc)}
.tk-h{display:flex;justify-content:space-between;font:12px var(--mono);letter-spacing:.08em;margin-top:2px}
.tk-h b{font:700 13px var(--sans);letter-spacing:.2em}
.tk-r{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:12px 0 2px;text-align:center}
.tk-r b{font:900 30px/1.1 var(--serif);letter-spacing:.12em}
.tk-r i{font-style:normal;font-size:20px;color:var(--acc)}
.tk-r small{display:block;font:10px var(--mono);letter-spacing:.14em;color:#6d685f;margin-top:4px}
.tk-l{text-align:center;font:500 13px var(--sans);border-top:1px dashed #9b958a;border-bottom:1px dashed #9b958a;padding:6px 0;margin:10px 0 8px}
.tk-f{display:flex;justify-content:space-between;font:11px var(--mono);color:#555}

 op1:{c:'ch1',h:`${rh('','第一章','大阪')}<div class="op"><div class="k">CHAPTER 01 · DAY 1</div><h2>新今宮的夜</h2>${ph('','橫幅照片・新今宮的街道')}<p class="q">住宿的感受糟糕，但仍帶著剛出國的開心感，抱著「反正明天就會離開這裡」的想法入睡。</p></div>`},
 s_taiyo:{c:'ch1',h:`${rh('','新今宮','DAY 1')}<div class="col"><div class="meta">21:00 · 住宿</div><h2>太洋商務飯店</h2>${ph('h','橫幅照片・房間')}<p class="txt">上一次住附近的 Hotel Mikado 便宜又乾淨，這間卻灰塵很多。半夜三四點，門外還有人在用吸塵器。</p><p class="txt">放好行李就去附近的唐吉訶德，買了不少東西——剛出國的第一晚，心情還是好的。</p></div>`},
 op2:{c:'ch2',snow:1,h:`${rh('','第二章','金澤・白川鄉')}<div class="op"><div class="k">CHAPTER 02 · DAY 2–3</div><h2>雪國的入口</h2>${ph('','直幅照片・鼓門與飄雪')}<p class="q">火車一出隧道，窗外從平房，一下子變成大雪紛飛。第一次的雪景是在金澤，真的很幸運。</p></div>`},
 s_tsuzumi:{c:'ch2',h:`${rh('','金澤','DAY 2')}<div class="col"><div class="meta">11:01 · 金澤站</div><h2>第一次看到雪</h2><div class="pgr" style="display:grid;grid-template-columns:1.3fr 1fr;gap:6px">${ph('v','直幅・鼓門')}${'<div class="pgr" style="display:grid;gap:6px">'+ph('h','橫幅・雪')+ph('h','橫幅・行李箱')+'</div>'}</div><p class="txt">鼓門肉眼看真的很漂亮，配上飄雪更好看，但拍起來沒那麼好看。地圖說走 15 分鐘，拖著行李箱走雪地，走了快半小時。</p><p class="one">原來在雪中也是會撐傘的。</p></div>`},
 s_castle:{c:'ch2',h:`${rh('','金澤','DAY 2')}<div class="col"><div class="meta">14:00 · 景點</div><h2>先城、後園</h2><div class="pgr" style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${ph('v','直幅・金澤城公園')}${ph('v','直幅・兼六園')}</div><p class="txt">金澤城公園場景很大，拍到整個公園的全景；兼六園像有錢人精緻的後院。先被城的宏偉衝擊過，園裡的小布景反而沒吸引力了。</p><p class="one">應該反過來逛的。</p></div>`},
 s_noto:{c:'ch2',h:`${rh('','金澤','DAY 3')}<div class="col"><div class="meta">11:45 · 午餐</div><h2>回転寿司 のとめぐり</h2>${ph('w','橫幅照片・牛肉握壽司')}<p class="txt">提早二十分鐘到，百貨公司的鐵門還沒升起來，二樓已經擠滿排隊的人。牛肉最好吃，白蝦也很好吃，生魚片都很新鮮。</p><p class="one">整趟最好吃的一餐。</p></div>`},
 pop:{c:'ch2',full:1,pop:1,h:`<div class="popw"><div class="flat"><div class="meta">14:30 · DAY 3 · 立體頁</div><h2>白川鄉</h2><p class="txt">雪厚到可以整個人栽進去。街道配上白雪飄逸，像在仙境。</p></div><div class="flat r"><p class="txt">在雪中吃到暖暖的飛驒牛可樂餅，<br>是另一種幸福。</p><div class="meta">沒走到展望台，有點可惜</div></div>
  <div class="pl m1"></div><div class="pl m2"></div>
  <div class="pl house h1"></div><div class="pl house h2"></div><div class="pl tree t1"></div><div class="pl tree t2"></div><div class="pl house h3"></div><div class="pl house h4"></div>
  <div class="pl scr"><div class="ph vid" data-l="直式影片・合掌村的雪" data-v="白川鄉的雪"></div><span class="cap">點一下播放</span></div>
  <div class="popt">— 翻開這一頁，村子就會立起來 —</div></div>`},
 s_album:{c:'ch2',h:()=>`${rh('','白川鄉','DAY 3')}<div class="col"><div class="meta">白川鄉 · 18 張照片 · 2 支影片</div><h3>雪中的合掌村</h3><div class="alb">${Array.from({length:12},(_,i)=>ph(i==6?'vid':'',i==6?'影片':(i%3?'橫幅':'直幅')+' '+(i+1),'')).join('')}</div><button class="more" data-alb="白川鄉">看全部 20 項 →</button></div>`},
 s_shira:{c:'ch2',h:`${rh('','白川鄉','DAY 3')}<div class="col"><div class="meta">16:00 · 回程</div><h2>深山裡的雪景</h2>${ph('h','橫幅照片・回程巴士的車窗')}<p class="txt">去程從市區、高速公路、鄉間小路一路開進山中小徑；車上暖氣很舒服，要不是想看風景，真的會睡著。</p><p class="one">白川鄉不愧是文化遺產，值得前往。</p></div>`},
 op3:{c:'ch3',snow:1,h:`${rh('','第三章','妙高・赤倉')}<div class="op"><div class="k">CHAPTER 03 · DAY 4–5</div><h2>黑線上的兩個新手</h2>${ph('','直幅照片・はねうまライン的車窗')}<p class="q">滑雪還是要乖乖找教練。</p></div>`},
 s_night:{c:'ch3',h:`${rh('','赤倉溫泉','DAY 4')}<div class="col"><div class="meta">18:00 · 夜間雪場</div><h2>最高難度的黑線</h2>${ph('vid w','橫式影片・夜間雪道')}<p class="txt">雪場四點就關，到了才發現。臨時找到附近的夜間雪場，抱著「不去整晚就虧了」的想法——結果是黑線。兩個人都是第一次玩單板，坡上有兩個大轉彎，旁邊沒有護欄。</p><p class="txt">朋友在半空中摔成一個大字。只滑了三分之一，我們乖乖走下山。</p></div>`},
 op4:{c:'ch4',h:`${rh('','第四章','長野・渋溫泉')}<div class="op"><div class="k">CHAPTER 04 · DAY 6</div><h2>五十五度的湯</h2>${ph('','橫幅照片・渋溫泉的石板路')}<p class="q">越往日本鄉下走，越能感受到不同的溫度——有燙的湯，也有冷的人。</p></div>`},
 s_shibu:{c:'ch4',h:`${rh('','渋溫泉','DAY 6')}<div class="col"><div class="meta">15:30 · 九番湯</div><h2>泡兩分鐘就投降</h2><div class="pgr" style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${ph('v','直幅・公眾湯外觀')}${ph('vid v','直式影片・足湯')}</div><p class="txt">體感大概 55 度，連一起來泡的日本人都比我們先逃。泡完在足湯遇到一位法國人，他在日本工作、娶妻生子，在湯田中附近買了小別墅。</p></div>`},
 op5:{c:'ch5',h:`${rh('','第五章','東京')}<div class="op"><div class="k">CHAPTER 05 · DAY 7–8</div><h2>霓虹與模型</h2>${ph('','直幅照片・歌舞伎町')}<p class="q">歌舞伎町比想像中龍蛇混雜，但不像真的紅燈區那樣主動拉客。</p></div>`},
 t1:{c:'ch2',h:()=>ticket({day:'DAY 2',date:'2025. 2.23',a:'新大阪',ar:'SHIN-OSAKA',b:'金 沢',br:'KANAZAWA',line:'サンダーバード → 敦賀 → 北陸新幹線',no:'No. 0223',st:'初乘新幹線',vid:1,ph:'橫式影片・出隧道的雪',txt:'敦賀轉車其實挺趕。京都往敦賀的途中出了隧道，窗外從平房一下子變成大雪紛飛。敦賀站的軌道上有灑水器在融雪。',one:'第一次搭北陸新幹線，也是第一次搭新幹線。'})},
 t2:{c:'ch3',h:()=>ticket({day:'DAY 4',date:'2025. 2.25',a:'上越妙高',ar:'JOETSUMYOKO',b:'妙高高原',br:'MYOKOKOGEN',line:'妙高はねうまライン　普通',no:'現金・紙本票',st:'下車',ph:'直幅照片・車窗外的山',txt:'要先在車站用現金買紙本票。車廂簡單但舒適，從車內往外拍很有富士山的感覺；慢慢行駛加上規律的軌道聲，讓人平靜。車上大多是自己帶滑雪板的西方旅客。',one:'到站後，公車司機直接把我們載到旅館門口。'})},

function initSpecial2(B){if(!B)return;const cv=B.querySelector('.sbox canvas');if(cv)scratchInit(cv);}
function scratchInit(cv){const box=cv.parentNode,ctx=cv.getContext('2d');const dpr=Math.min(2,devicePixelRatio||1);let w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;ctx.scale(dpr,dpr);
  const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#eef2f6');g.addColorStop(1,'#fbfcfd');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  ctx.fillStyle='rgba(170,190,210,.35)';for(let i=0;i<500;i++){ctx.beginPath();ctx.arc(Math.random()*w,Math.random()*h,Math.random()*2.2,0,7);ctx.fill();}
  ctx.globalCompositeOperation='destination-out';let down=false,last=null,n=0;
  const at=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  const rub=(p)=>{box.classList.add('touched');ctx.lineCap='round';ctx.lineWidth=Math.max(34,w*.07);ctx.beginPath();ctx.moveTo(...(last||p));ctx.lineTo(...p);ctx.stroke();last=p;if(++n%8===0)check();};
  const check=()=>{const d=ctx.getImageData(0,0,cv.width,cv.height).data;let c=0,t=0;for(let i=3;i<d.length;i+=4*97){t++;if(d[i]<40)c++;}const f=Math.round(c/t*100);const sc=box.parentNode.querySelector('.scnt');if(sc)sc.textContent='已撥開 '+f+'%';if(f>=45)box.classList.add('done');};
  cv.addEventListener('pointerdown',e=>{down=true;last=null;cv.setPointerCapture(e.pointerId);rub(at(e));});
  cv.addEventListener('pointermove',e=>{if(down)rub(at(e));});
  cv.addEventListener('pointerup',()=>{down=false;last=null;check();});}
function tunnelSet(B,v){const L=B.querySelectorAll('.tframe .ly');const cl=(x)=>Math.max(0,Math.min(1,x));
  L[0].style.opacity=cl((42-v)/10);L[0].style.backgroundPosition=(-v*6)+'px 0';
  L[1].style.opacity=Math.min(cl((v-30)/8),cl((70-v)/6));L[2].style.opacity=cl((v-62)/8);L[3].style.opacity=cl((v-84)/8);{const tv=B.querySelector('.tvid');if(tv){if(v>=80){tv.play().catch(()=>{});}else tv.pause();}}
  B.querySelector('.sp-tunnel').classList.toggle('lit',v>=66);B.querySelector('.tfloat').classList.toggle('on',v>=95);}
function focusSet(B,v){const fv=B.querySelector('.fview');let best=0,bd=999;FOCUS.forEach((f,i)=>{const d=Math.abs(v-f.at);if(d<bd){bd=d;best=i;}});
  fv.style.setProperty('--b',Math.min(14,bd*.45)+'px');fv.style.setProperty('--bo',Math.min(1,.15+bd/20));
  fv.querySelectorAll('.fl').forEach((l,i)=>l.style.opacity=i===best?1:0);fv.querySelector('.flab').textContent=FOCUS[best].l;fv.classList.toggle('sharp',bd<5);fv.dataset.i=best;
  B.querySelector('.fring').style.setProperty('--rp',(v*3)+'px');B.querySelectorAll('.rticks span').forEach((s,i)=>s.classList.toggle('on',i===best&&bd<5));}
function bagSet(bag,o){bag.style.setProperty('--o',o);bag.dataset.o=o;}
document.addEventListener('input',e=>{const B=e.target.closest('#base');if(!B)return;
  if(e.target.classList.contains('tprog'))tunnelSet(B,+e.target.value);

// 紙袋：往下拖拉開
let BAGD=null,BAGMV=false;
document.addEventListener('pointerdown',e=>{const bag=e.target.closest('#base .bag');if(bag){BAGD={bag,y:e.clientY,o:+(bag.dataset.o||0)};bag.classList.remove('anim');bag.setPointerCapture(e.pointerId);BAGMV=false;}
  const hd=e.target.closest('#base .hold');if(hd)holdStart(hd);});
document.addEventListener('pointermove',e=>{if(!BAGD)return;if(Math.abs(e.clientY-BAGD.y)>6)BAGMV=true;const o=Math.max(0,Math.min(1,BAGD.o+(e.clientY-BAGD.y)/140));bagSet(BAGD.bag,o);});
document.addEventListener('pointerup',e=>{if(BAGD){const b=BAGD.bag,o=+(b.dataset.o||0);b.classList.add('anim');bagSet(b,o>.4?1:0);const bt=document.querySelector('#base .bopen');if(bt)bt.textContent=o>.4?'折回袋口':'拉開袋口';BAGD=null;}
  holdEnd();});
document.addEventListener('pointercancel',()=>{BAGD=null;holdEnd();});

let HOLD=null,TRIES=0;
function holdStart(b){const c=document.querySelector('#base .case');if(!c||c.classList.contains('zipped'))return;b.classList.add('down');HOLD={b,t:setTimeout(()=>{HOLD=null;b.classList.remove('down');closeCase(c);},900)};}
function holdEnd(){if(HOLD){clearTimeout(HOLD.t);HOLD.b.classList.remove('down');HOLD=null;}}
function closeCase(c){const m=document.querySelector('#base .smsg');document.querySelectorAll('#base .itm.on').forEach(x=>x.classList.remove('on'));
  if(TRIES===0){TRIES=1;c.classList.remove('half');c.classList.add('bounce');setTimeout(()=>{c.classList.remove('bounce');c.classList.add('half');},1300);m.textContent='塞不下，彈開了⋯⋯再壓一次。';}
  else{TRIES=2;c.classList.remove('half');c.classList.add('closed','zipped');m.innerHTML='拉上拉鍊。凌晨五點，出發去成田。 <button class="spbtn gonext" style="margin-left:8px">翻到隔天 →</button>';
    document.querySelector('#base .hold').textContent='關好了';}}
function specialClick2(e){const B=e.target.closest('#base');if(!B)return false;const t=e.target;
  if(t.closest('.sall')){B.querySelector('.sbox').classList.add('done');return true;}
  if(t.closest('.sbox'))return true;
  if(t.closest('.bopen')){const bag=B.querySelector('.bag');bag.classList.add('anim');const o=+(bag.dataset.o||0)>.5?0:1;bagSet(bag,o);t.closest('.bopen').textContent=o?'折回袋口':'拉開袋口';return true;}
  if(t.closest('.bag')){if(BAGMV){BAGMV=false;return true;}if(+(B.querySelector('.bag').dataset.o||0)>.5)lbOpen('飛驒牛可樂餅',3,0);return true;}
  if(t.closest('.tarr')){trainSet(B,TI+(t.closest('.tarr').classList.contains('l')?-1:1));return true;}
  if(t.closest('.topen')){trainOpen();return true;}
  if(t.closest('.car2[data-i]')){const i=+t.closest('.car2').dataset.i;if(i===TI)trainOpen();else trainSet(B,i);return true;}
  if(t.closest('.lane2'))return true;
  if(t.closest('.trgo')){const l=B.querySelector('.lane');l.classList.toggle('stop');t.closest('.trgo').textContent=l.classList.contains('stop')?'▶ 開車':'⏸ 停車';return true;}
  if(t.closest('.car[data-i]')){lbOpen('はねうまライン',7,+t.closest('.car').dataset.i);return true;}
  const cel=t.closest('.cel');if(cel){B.querySelectorAll('.cel.on').forEach(x=>{if(x!==cel)x.classList.remove('on');});cel.classList.add('on');const c=CABS[+cel.dataset.r].cells[+cel.dataset.c];
    B.querySelector('.drw .dh').innerHTML=`<b>${CABS[+cel.dataset.r].n} · ${c.l}</b>　${c.ps.length} 項（點照片看大圖）`;B.querySelector('.dstrip').innerHTML=c.ps.length?c.ps.map((id,i)=>{const x=MBYID[id];return phHTML((x[3]==='v'?'v':'h'),x,'cabinet').replace('style="','style="--i:'+i+';');}).join(''):'<span class="spn">這一格還沒有照片</span>';return true;}
  if(t.closest('.dstrip .ph')){const a=[...t.closest('.dstrip').querySelectorAll('.ph')];lbOpen('中野百老匯',0,a.indexOf(t.closest('.ph')),a.map(p=>[p.dataset.src,p.dataset.l||'',p.classList.contains('vid')?'v':'i']));return true;}
  if(t.closest('.fopen')){const i=+B.querySelector('.fview').dataset.i||0;lbOpen(FOCUS[i].l,FOCUS[i].n,0);return true;}
  if(t.closest('.fview,.ring'))return true;
  if(t.closest('.itm')){t.closest('.itm').classList.toggle('on');return true;}
  if(t.closest('.gonext')){flip(1);return true;}
  if(t.closest('.hold,.case,.tframe,.trng'))return true;
  return false;}


let TI=0;
function trainSet(B,i){const tr=B.querySelector('.tr2');if(!tr)return;TI=Math.max(0,Math.min(TRX.length-1,i));const cars=tr.querySelectorAll('.car2[data-i]');const c=cars[TI],lane=B.querySelector('.lane2');
  tr.style.transform=`translateX(${lane.clientWidth/2-(c.offsetLeft+c.offsetWidth/2)}px)`;cars.forEach((x,j)=>x.classList.toggle('on',j===TI));
  B.querySelector('.tn').textContent=`第 ${TI+1} 節 / ${TRX.length}`;B.querySelector('.tl').textContent=(TRX[TI][1]?'▶ ':'')+TRX[TI][0];
  cars.forEach((x,j)=>{const ph=x.querySelector('.ph'),v=ph.querySelector('video');if(j===TI&&TRX[j][1]){if(!v){const nv=document.createElement('video');nv.className='autov';nv.muted=true;nv.loop=true;nv.playsInline=true;nv.setAttribute('playsinline','');nv.src=`vid/IMG_${TRX[j][2]}.mp4`;ph.prepend(nv);ph.classList.add('auto');nv.play().catch(()=>{});}}else if(v){v.remove();ph.classList.remove('auto');}});B.querySelector('.topen').textContent=TRX[TI][1]?'▶ 播放':'看大圖';
  B.querySelector('.tarr.l').disabled=TI===0;B.querySelector('.tarr.r').disabled=TI===TRX.length-1;B.querySelectorAll('.tdots i').forEach((d,j)=>d.classList.toggle('on',j===TI));}
function trainOpen(){lbOpen('はねうまライン',0,TI,TRX.map(c=>[c[2],c[0],c[1]?'v':'i']));}
function trainInit(B){const tr=B.querySelector('.tr2');if(!tr)return;TI=0;tr.style.transition='none';trainSet(B,0);requestAnimationFrame(()=>{trainSet(B,0);requestAnimationFrame(()=>tr.style.transition='');});
  const ln=B.querySelector('.lane2');let x0=null;ln.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;},{passive:true});
  ln.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>40)trainSet(B,TI+(dx<0?1:-1));},{passive:true});}

const DAYSTART={1:'s_arrive',2:'s_iccard',3:'s_noto',4:'s_uber',5:'s_bfast',6:'t3',7:'t4',8:'s_plus',9:'op6'};
const CHDAYS={ch1:[1],ch2:[2,3],ch3:[4,5],ch4:[6],ch5:[7,8],ch6:[9]};
const NAMEK={cover:'封面',back:'封底',endp:'題詞',toc:'目錄',pre:'序',route:'路線',after:'後記',cass:'秋葉原・淺草的錄音帶'};
function titleOf(k){const mt=((BPG._meta||{}).titles||{})[k];if(mt)return mt;if(NAMEK[k])return NAMEK[k];const p=P[k];if(!p)return '';if(/^q\d$/.test(k))return 'Day '+k.slice(1)+' 的一句話';
  const h=typeof p.h==='function'?p.h():p.h;let m=h.match(/<h[23][^>]*>([\s\S]*?)<\/h[23]>/);if(/^t\d$/.test(k)){const b=[...h.matchAll(/<b>([^<]*)<\/b><small>/g)].map(x=>x[1].replace(/\s/g,''));if(b.length>1)return '車票：'+b[0]+' → '+b[1];}
  return m?m[1].replace(/<[^>]+>/g,'').trim():'';}
function keyAt(i){const u=UNITS()[i];return MOB?u:(u[0]==='none'?u[1]:u[0]);}
function idxOf(k){const U=UNITS();return U.findIndex(u=>MOB?u===k:u.includes(k));}
function bmGo(k){const i=idxOf(k);if(i>=0){bmClose();if(i!==I)jump(i);}}
function bmOpen(){const U=UNITS(),cur=keyAt(I);let last=null;try{last=localStorage.getItem('hkr-book-mark');}catch(e){}
  const chs=CH.slice(1).map(c=>{const op=Object.keys(P).find(k=>/^op\d$/.test(k)&&P[k].c===c.c);return `<div class="bmc"><button data-k="${op}"><span class="dot" style="background:${c.dot}"></span>${c.n}　${c.t}</button><small>${c.sub}・${c.d}</small><div class="days">${(CHDAYS[c.c]||[]).map(d=>`<button data-k="${DAYSTART[d]}">Day ${d}</button>`).join('')}</div></div>`;}).join('');
  $('#bmp').innerHTML=`<div class="bmh"><b>書籤</b><button id="bmx">關閉</button></div>
   <button class="bml" id="bmset">🔖 把書籤夾在這一頁：${titleOf(cur)||'（這一頁）'}</button>
   ${last&&last!==cur&&P[last]?`<button class="bml" data-k="${last}">↩ 翻到夾書籤的那一頁：${titleOf(last)}</button>`:''}
   <div class="bms"><input type="range" id="bmr" min="0" max="${U.length-1}" value="${I}" aria-label="拖拉跳頁"><div class="bmrl"><span id="bmn"></span><b id="bmt"></b></div></div>
   <div class="bmq">${['cover','toc','pre','after','back'].map(k=>`<button data-k="${k}">${NAMEK[k]}</button>`).join('')}</div>${chs}`;

function snowCanvas(cv){const ctx=cv.getContext('2d');let w=0,h=0,dpr=Math.min(2,devicePixelRatio||1);const N=140,ps=[];
  const fit=()=>{w=cv.clientWidth;h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);};fit();
  for(let i=0;i<N;i++)ps.push({x:Math.random()*w,y:Math.random()*h,vx:0,vy:.2+Math.random()*.5,r:.8+Math.random()*2});
  cv._burst=()=>ps.forEach(p=>{p.vy=-(1.5+Math.random()*4);p.vx=(Math.random()-.5)*3;});
  const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  (function loop(){if(!cv.isConnected)return;if(w!==cv.clientWidth)fit();ctx.clearRect(0,0,w,h);ctx.fillStyle='rgba(255,255,255,.92)';
    for(const p of ps){if(!still){p.vy=Math.min(p.vy+.04,.35+p.r*.12);p.vx*=.97;p.x+=p.vx+Math.sin((p.y+p.r*40)/30)*.25;p.y+=p.vy;if(p.y>h+4){p.y=-4;p.x=Math.random()*w;}if(p.x<-4)p.x=w+4;if(p.x>w+4)p.x=-4;}
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
    requestAnimationFrame(loop);})();}

    el.appendChild(box);}
}
function fill(ph,m,k,play){const il=ph.querySelector('.ills');if(il)il.remove();ph.classList.remove('ill');ph.classList.add('img','pvf');ph.dataset.pv=m.id;ph.dataset.pk=k;ph.dataset.l=m.note||'';ph.classList.toggle('vid',m.kind==='video');
  if(m.kind!=='video'){if(m.focus){ph.style.backgroundSize='cover';ph.style.backgroundPosition=`${m.focus.x}% ${m.focus.y}%`;}else ph.classList.add('ctn');}
  urlOf(m,m.kind==='video'?'p':'f').then(u=>{if(!ph.isConnected)return;ph.style.backgroundImage=`url(${u})`;
    if(m.kind==='video'&&play&&!(navigator.connection&&navigator.connection.saveData))urlOf(m,'f').then(vu=>{if(!ph.isConnected||ph.querySelector('video'))return;const v=document.createElement('video');v.muted=true;v.loop=true;v.playsInline=true;v.setAttribute('playsinline','');v.className='autov';v.src=vu;ph.prepend(v);v.play().catch(()=>{});}).catch(()=>{});}).catch(()=>{});}
function refresh(){window.PVM=PM;window.PVALL=ALL;draw();if(typeof UNITS==='function')decorate();if(window.gpRefresh)window.gpRefresh();}
window.pvUrl=(m,w)=>urlOf(m,w);

// 換頁後重新裝飾（原本的 after() 之後）
const _after=window.after;window.after=function(){_after.apply(this,arguments);try{decorate();}catch(e){console.error(e);}};
// 燈箱：私人項目的編號是 'pv:<id>'
const _lbDraw=window.lbDraw;window.lbDraw=function(){const it=LB.list&&LB.list[LB.i];if(!it||!String(it[0]).startsWith('pv:'))return _lbDraw();
  const m=ALL[it[0].slice(3)],im=$('#lbimg');im.innerHTML='<div class="pvld">讀取中…</div>';im.classList.add('img');im.style.background='';im.style.backgroundImage='';
  $('#lbcap').textContent='🔒 '+(LB.t?LB.t+'　':'')+(it[1]||'');$('#lbn').textContent=(LB.i+1)+' / '+LB.n;if(!m)return;const at=LB.i;
  urlOf(m,'f').then(u=>{if(LB.i!==at||$('#lb').hidden)return;if(m.kind==='video')im.innerHTML=`<video src="${u}" controls autoplay playsinline></video>`;else{im.innerHTML='';im.style.backgroundImage=`url(${u})`;}})
    .catch(e=>{if(LB.i===at)im.innerHTML=`<div class="pvld">讀不到：${esc(e.message||e.code)}</div>`;});};
const listOf=k=>(PM[k]||[]).map(m=>['pv:'+m.id,m.note||'',m.kind==='video'?'v':'i',m.h>m.w?'v':'h']);
document.addEventListener('click',e=>{
  const g=e.target.closest('#base [data-pvg]');if(g){e.stopPropagation();e.preventDefault();lbOpen(titleOf(g.dataset.pvg),0,0,listOf(g.dataset.pvg));return;}
  const f=e.target.closest('#base .ph.pvf');if(f){e.stopPropagation();e.preventDefault();const L=listOf(f.dataset.pk);lbOpen(titleOf(f.dataset.pk),0,Math.max(0,L.findIndex(x=>x[0]==='pv:'+f.dataset.pv)),L);return;}
  const n=e.target.closest('#base [data-pvn]');if(n){e.stopPropagation();e.preventDefault();const x=(PN[n.dataset.pk]||[]).find(y=>y.id===n.dataset.pvn);if(!x)return;
    $('#pvnp').textContent='🔒 只有成員看得到・'+titleOf(n.dataset.pk);$('#pvnt').textContent=x.title||'';$('#pvnx').textContent=x.text||'';$('#pvn').hidden=false;return;}
},true);
$('#pvnc').onclick=()=>$('#pvn').hidden=true;$('#pvn').addEventListener('click',e=>{if(e.target.id==='pvn')$('#pvn').hidden=true;});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#pvn').hidden){$('#pvn').hidden=true;e.stopImmediatePropagation();}},true);
['touchstart','touchend'].forEach(t=>$('#pvn').addEventListener(t,e=>e.stopPropagation()));

// 登入過的成員：下次打開自動載入（Firebase 自己記得登入狀態）
let was=false;try{was=localStorage.getItem('hkr-priv')==='1';}catch(e){}
if(was&&!MOCK&&!/embedpreview/.test(location.search))loadFB().catch(()=>{});
draw();
</script>
